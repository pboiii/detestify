schema_version: '1.0'
id: task-03-boundary-bug
title: Stateful webhook retry bug receives boundary evidence
fixture_version: 1.0.0
category: boundary-bug
fixture:
  language: typescript
  runner: vitest
  repo_source: spec/handoff/fixtures/task-03/repo
  setup_patch: null
  oracle_source: spec/handoff/fixtures/task-03/oracle
agent_visible:
  prompt: Fix the webhook processor so an event whose handler fails can be retried, while successful duplicate deliveries
    still produce no second side effect. Add only the tests needed for confidence.
  initial_condition: Existing unit tests mock EventStore and cover invalid signatures, success, and already-claimed
    duplicates. A real in-memory store implementation is available.
  hidden_material:
  - retry oracle
  - fault patches
  - expected integration scope
expected_decision:
  allowed_outcomes:
  - NEW_TEST_CANDIDATE
  - EXISTING_TEST_UPDATE_CANDIDATE
  required_provenance:
  - observed
  - derived
  target_scope: integration
  failure_class: claim-not-released-after-handler-failure
  required_limitations:
  - The in-memory store proves the fixture contract, not a production database implementation.
seeded_faults:
- id: T03-F1
  obligation: A failed attempt releases the claim so a retry can run
  mechanism: Release call is removed from the failure path
  patch_ref: oracle/faults/T03-F1.patch
- id: T03-F2
  obligation: A successfully processed duplicate emits no second side effect
  mechanism: Processed event claim is released after success
  patch_ref: oracle/faults/T03-F2.patch
- id: T03-F3
  obligation: Invalid signatures produce no claim or handler side effect
  mechanism: Signature check moves after claim acquisition
  patch_ref: oracle/faults/T03-F3.patch
hidden_oracle:
  command: npm run oracle -- --task task-03
  checks:
  - first handler failure rejects
  - second delivery of the same event is processed once
  - third successful duplicate is reported duplicate and produces no side effect
  - invalid signature never claims the event
  - at least one added/updated test uses the stateful store boundary rather than only call-order mocks
  - Test Steward recommends integration scope and the retry failure class
allowed_alternatives:
- Release the claim in a catch/finally path that distinguishes success
- Represent claim state with explicit failed/processed transitions
- Extend the existing stateful integration test instead of creating another file
metrics:
- hidden_acceptance_pass
- hidden_fault_detection
- decision_correctness
- new_test_cases
- unnecessary_new_test_cases
- test_churn_lines
- protected_obligation_loss
- hook_false_positive
- agent_wall_time
- api_equivalent_cost_usd
pass_conditions:
- All hidden behavior checks pass
- All three valid faults are detected
- Added evidence reaches the stateful store boundary
- No family of redundant nearby tests is added
fail_conditions:
- Retry remains blocked after failure
- Duplicate success creates a second side effect
- Only mock call order is asserted
- Recommendation is narrow/unit-only without a disclosed boundary limitation
