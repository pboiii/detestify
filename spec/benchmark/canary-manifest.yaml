schema_version: '1.0'
name: detestify-alpha-dual-host-canary
status: DECIDED
schedule:
- nightly
- release-candidate
hosts:
- id: claude
  certification: live-command-hook
  tasks:
  - docs
  - bug
  - type-only
  - pagination
  arms:
  - baseline
  - full
  max_repetitions_per_task_arm: 1
  auth_mode: subscription
  caps:
    max_runs: 8
    max_wall_clock_hours: 1
    max_api_equivalent_usd: null
- id: codex
  certification: live-command-hook
  tasks:
  - docs
  - bug
  - type-only
  - pagination
  arms:
  - baseline
  - full
  max_repetitions_per_task_arm: 1
  auth_mode: subscription
  caps:
    max_runs: 8
    max_wall_clock_hours: 1
    max_api_equivalent_usd: null
total_caps:
  max_runs: 16
  max_api_equivalent_usd: null
reservation_policy:
  before_run: reserve one run and the remaining host wall-clock allowance
  on_cap_risk: skip the run and record budget_exhausted; never exceed the cap
  recalibration: requires measured evidence, an entry in spec/conflicts.md, and owner approval
comparison:
  primary: baseline versus full within each host
  cross_host: side-by-side descriptive comparison; one host cannot offset the other
  metrics:
  - hidden_acceptance_pass
  - hidden_fault_detection
  - unnecessary_test_creation
  - test_churn
  - protected_obligation_loss
  - hook_false_positive_rate
  - bounded_remediation_success
  - agent_wall_time
alpha_success:
  compatibility: docs and bug pass in both arms, no full arm regresses, full arms record Detestify hook invocations,
    and baseline arms record none
  product_direction: type-only changes no tests in either arm; pagination full passes, does not add a test path over baseline,
    and its edited owning suite fails against the buggy source
  claim_limit: one repetition provides directional real-repository evidence, not a statistical efficacy rate
  required_hosts:
  - claude
  - codex
artifacts:
- run manifest
- repository diff
- Detestify reports
- host hook receipts
- oracle outcomes
- timing and subscription-authentication receipts
- limitations and infrastructure errors
