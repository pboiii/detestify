name: Publish npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22.13"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download the verified release package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$package_version"
          gh release download "$RELEASE_TAG" --pattern "detestify-*.tgz" --dir "$RUNNER_TEMP"

      - name: Publish the exact GitHub release package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          mapfile -t tarballs < <(find "$RUNNER_TEMP" -maxdepth 1 -type f -name "detestify-*.tgz")
          test "${#tarballs[@]}" -eq 1
          npm publish "${tarballs[0]}" --access public --tag alpha --provenance
